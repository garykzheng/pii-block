[project]
name = "mcp-privacy-proxy"
version = "0.1.0"
description = "MCP proxy that intercepts tool calls to mask PII with deterministic surrogates"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.9",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "ff3>=1.0",
    "faker>=24.0,<26",
    "spacy>=3.7",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["proxy", "middleware", "operators", "mapping_store", "config", "server_registry", "audit", "core", "dashboard", "server", "manage"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
